# Vigie and its ClickHouse. Run through deploy/install.sh, which writes .env next to this file.
# ClickHouse has no published port. Vigie binds to loopback: reach it through Tailscale, or add --profile public for Caddy with HTTPS.
name: vigie

services:
  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    restart: unless-stopped
    environment:
      CLICKHOUSE_USER: vigie
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?run deploy/install.sh}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 0
      CLICKHOUSE_DB: vigie
    volumes:
      - clickhouse:/var/lib/clickhouse
      - ./clickhouse/vigie.xml:/etc/clickhouse-server/config.d/vigie.xml:ro
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    mem_limit: 900m
    cpus: 2
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
    networks: [internal]

  vigie:
    image: ${VIGIE_IMAGE:-vigie:local}
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        BUN_IMAGE: ${BUN_IMAGE:-oven/bun:1.4.2-alpine}
    restart: unless-stopped
    depends_on:
      clickhouse: { condition: service_healthy }
    # Everything in deploy/.env reaches Vigie. The values under environment win over it.
    env_file: .env
    environment:
      VIGIE_PUBLIC_URL: ${VIGIE_PUBLIC_URL:?run deploy/install.sh}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?run deploy/install.sh}
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: vigie
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      VIGIE_APP_DATABASE_URL: ${VIGIE_APP_DATABASE_URL:-}
      VIGIE_APP_API_URL: ${VIGIE_APP_API_URL:-}
      VIGIE_APP_URL: ${VIGIE_APP_URL:-}
      VIGIE_LINEAR_API_KEY: ${VIGIE_LINEAR_API_KEY:-}
      VIGIE_LINEAR_TEAM_ID: ${VIGIE_LINEAR_TEAM_ID:-}
      VIGIE_AI_API_KEY: ${VIGIE_AI_API_KEY:-}
      VIGIE_AI_BASE_URL: ${VIGIE_AI_BASE_URL:-}
      VIGIE_AI_MODEL: ${VIGIE_AI_MODEL:-}
      VIGIE_SLACK_WEBHOOK: ${VIGIE_SLACK_WEBHOOK:-}
      VIGIE_OIDC_ISSUER: ${VIGIE_OIDC_ISSUER:-}
      VIGIE_OIDC_CLIENT_ID: ${VIGIE_OIDC_CLIENT_ID:-}
      VIGIE_OIDC_CLIENT_SECRET: ${VIGIE_OIDC_CLIENT_SECRET:-}
      VIGIE_ALERT_ENV: ${VIGIE_ALERT_ENV:-PRD}
    ports:
      - "${VIGIE_BIND:-127.0.0.1}:${VIGIE_APP_PORT:-4310}:4310"
      - "${VIGIE_BIND:-127.0.0.1}:${VIGIE_OTLP_PORT:-4318}:4318"
    volumes:
      - data:/data
      - ${VIGIE_DEFINITIONS_DIR:-../definitions}:/app/definitions:ro
    # The filesystem is read-only: the app can write only to its data volume and /tmp.
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 350m
    cpus: 1
    networks: [internal, default]

  caddy:
    image: caddy:2.10-alpine
    profiles: [public]
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      VIGIE_DOMAIN: ${VIGIE_DOMAIN:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data
    mem_limit: 80m
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]

networks:
  internal: { internal: true }

volumes:
  clickhouse:
  data:
  caddy:
